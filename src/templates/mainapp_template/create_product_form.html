{% extends 'base.html' %}

{% block content %}
    <h1>Создание продукта</h1>
    <form enctype="multipart/form-data" action="/mainapp/add_product" method="POST">
        {% csrf_token %}
        {{ form }}

        <div class="col-auto">
            <button type="submit" class="btn-primary mb-3">Создать</button>
        </div>
    </form>
{% endblock %}

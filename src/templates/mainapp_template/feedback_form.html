{% extends 'base.html' %}

{% block content %}

    <h1>Отзыв</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-error">{{ form.non_field_errors }}</div>
        {% for f in form %}
            <p><label class="form-label"
                      for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
            </p>
            <div class="form-error">{{ f.errors }}</div>
        {% endfor %}
        <div class="col-auto">
            <button type="submit" class="btn-primary mb-3">
                Оставить отзыв
            </button>
        </div>
    </form>
{% endblock %}
